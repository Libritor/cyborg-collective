<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest scan</title>
<!-- The object the Quest scanned, as the Gaussian splat trained from its pictures, and the solid made from it for
     the printer. On the laptop: drag to turn, wheel to zoom. In the Quest Browser: "Enter" puts it in the room at
     real size (right stick: turn and resize; trigger: splat / solid / both).
     One file, two places. On the laptop scan_view.py serves it with the run folder's files under data/. On the
     published site it is scans/view.html and ?scan=<id> names a folder under runs/ written by scan_publish.py,
     whose meta.json says which files to load (the splats compressed to .spz there). -->
<style>
  :root { color-scheme: dark; --ink: #e9edf2; --dim: #9aa6b4; --panel: rgba(18, 22, 28, 0.86); --line: #2c3540; --go: #37d67a; }
  html, body { margin: 0; height: 100%; background: #0d1014; color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; left: 12px; top: 12px; width: min(330px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #facts { margin: 6px 0 10px; padding: 0; list-style: none; font-size: 13px; }
  #facts li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding: 3px 0; }
  #facts span:first-child { color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button, a.btn { font: inherit; color: var(--ink); background: #1b222b; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; text-decoration: none; }
  button.on { border-color: var(--go); color: var(--go); }
  #status { position: fixed; left: 12px; bottom: 12px; color: var(--dim); font-size: 12px; background: var(--panel); padding: 4px 8px; border-radius: 6px; max-width: calc(100vw - 24px); box-sizing: border-box; }
  #xr { position: fixed; right: 12px; bottom: 12px; }
  #xr .ask { display: block; max-width: 250px; color: var(--dim); font-size: 12px; background: var(--panel); padding: 6px 9px; border-radius: 6px; }
  #xr .ask a, #note a, #panel .back { color: var(--ink); }
  #panel .back { display: inline-block; font-size: 12px; margin-bottom: 6px; }
  #note { color: var(--dim); font-size: 12.5px; margin: 0 0 8px; }
  #more > summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  #plain { max-width: 60ch; margin: 28px auto; padding: 0 16px; } #plain a { color: inherit; }
  @media (max-width: 700px) { #status { bottom: 56px; } }
</style>
<noscript><style>#panel, #status, #xr { display: none; }</style></noscript>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/", "@sparkjsdev/spark": "./vendor/spark.module.min.js" } }
</script>
</head>
<body>
<noscript><div id="plain">
  <h1>A scan in 3-D</h1>
  <p>Drawing a scan so that it can be turned round needs JavaScript, which is off in this browser. <a href="./">The list of scans</a> shows each one as a picture, with its numbers and its files, and needs none.</p>
</div></noscript>
<div id="panel">
  <a class="back" id="back" href="./" hidden>← all scans</a>
  <h1 id="title">Quest scan</h1>
  <div class="sub" id="sub">loading…</div>
  <details id="more" open>
    <summary>about this scan</summary>
    <p id="note" hidden></p>
    <ul id="facts"></ul>
  </details>
  <div class="row">
    <button id="bSplat" class="on">splat</button>
    <button id="bSolid">solid</button>
    <button id="bRoom">room</button>
    <button id="bTurn" class="on">turn</button>
    <button id="bModel" style="display:none">3-D model</button>
  </div>
  <div class="row" id="files"></div>
</div>
<div id="status">starting</div>
<div id="xr"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SparkRenderer, SplatMesh, SparkXr } from '@sparkjsdev/spark';

const say = (t) => { document.getElementById('status').textContent = t; };
const q = new URLSearchParams(location.search);
const state = { ready: false, splats: 0, error: null, xr: false, frames: 0 };
window.viewer = state;

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: q.has('shot') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1014, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
const spark = new SparkRenderer({ renderer });
scene.add(spark);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 1.5); scene.add(sun);

// everything scanned hangs under `stand`: its origin is the middle of the object's base, y up, metres
const stand = new THREE.Group(); scene.add(stand);
const turn = new THREE.Group(); stand.add(turn);
const plate = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.004, 64), new THREE.MeshStandardMaterial({ color: 0x2a323c, roughness: 0.9 }));
plate.position.y = -0.002; turn.add(plate);
let object = null, solid = null, room = null, size = 0.2;
const show = { splat: true, solid: false, room: false, turn: !q.has('still') };

// which scan: on the laptop the one run scan_view.py serves under data/; on the site ?scan=<id>, a folder under runs/
const scan = (q.get('scan') || '').replace(/[^\w.-]/g, '');
const base = scan ? `runs/${scan}/` : 'data/';
state.scan = scan || null;
if (scan) document.getElementById('back').hidden = false;
if (innerWidth < 700) document.getElementById('more').open = false;      // a phone: the picture first, the words on request
const meta = await fetch(base + 'meta.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
// "view": not one object but everything that was looked at, to be seen from the spot it was photographed from
const viewMode = !!(meta && meta.mode === 'view');
state.mode = viewMode ? 'view' : 'object';
// the files to load: named by a published scan's meta.json, else the names quest_scan.py writes
const had = (meta && meta.files) || {};
const F = !meta ? {} : {
  splat: meta.splat || (viewMode ? 'view.ply' : 'object.ply'),
  scene: meta.scene || (had['scene.ply'] ? 'scene.ply' : null),
  solid: meta.solid || (had['object.glb'] ? 'object.glb' : null),
  model: meta.model || (had['room.glb'] ? 'room.glb' : null) };
const stamp = '?v=' + encodeURIComponent((meta && meta.made) || '');
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (!meta) { say(scan ? 'there is no scan called ' + scan : 'no scan yet: run quest_scan.py, then reload'); state.error = 'no meta.json'; }
else {
  const test = meta.kind === 'test';
  document.getElementById('title').textContent = document.title = meta.title || meta.name;
  const s = meta.size_cm || [20, 20, 20];
  size = Math.max(s[0], s[1], s[2]) / 100;
  document.getElementById('sub').textContent = (test ? 'a test of the method, not a headset scan'
    : viewMode ? 'what the Quest 3S looked at, from where it was' : 'scanned with the Quest 3S') + ` · ${meta.made || ''}`;
  if (meta.note) { const n = document.getElementById('note'); n.textContent = meta.note; n.hidden = false; }
  const common = [['pictures', meta.pictures],
    ['splat', meta.train && meta.train.gaussians ? `${meta.train.gaussians.toLocaleString()} Gaussians, ${meta.train.steps} steps` : '—'],
    ['held-out pictures', meta.train && meta.train.held_out_psnr_db ? `${meta.train.held_out_psnr_db} dB` : '—']];
  const rm = meta.room;
  const facts = viewMode ? common.concat(rm && rm.size_m
      ? [['room model', `${rm.size_m[0]} × ${rm.size_m[2]} m, ${rm.size_m[1]} m high (estimated)`],
         ['diorama print', rm.print && rm.print.size_mm ? `${rm.print.scale}, ${rm.print.size_mm.map(v => Math.round(v)).join(' × ')} mm` : '—'],
         ['slicer', rm.print && rm.print.slice ? rm.print.slice.replace(/^sliced \S+ for the H2C: /, '') : '—']]
      : [['solid', 'none: the pictures are from one spot']])
    : [['real size', `${s[0]} × ${s[2]} × ${s[1]} cm high`]].concat(common,
      meta.check && meta.check.median_mm != null ? [['against the true shape', `${meta.check.median_mm} mm (median)`]] : [], [
      ['print', meta.print && meta.print.print_size_mm ? `${meta.print.print_size_mm.map(v => Math.round(v)).join(' × ')} mm` : '—'],
      ['slicer', meta.print && meta.print.slice ? meta.print.slice.replace(/^sliced \S+ for the H2C: /, '') : '—']]);
  document.getElementById('facts').innerHTML = facts.map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('');
  // files to take away: a published scan lists its own; on the laptop, whatever the run made
  const mb = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)} MB` : `${Math.max(1, Math.round(n / 1e3))} kB`;
  document.getElementById('files').innerHTML = meta.downloads
    ? meta.downloads.map(d => `<a class="btn" href="${base}${esc(d.file)}" download title="${mb(d.bytes)}">${esc(d.label)}</a>`).join('')
    : [['object_print.stl', 'STL'], ['object_real_size.stl', 'STL 1:1'], ['object_h2c.3mf', 'H2C 3MF'],
       ['room.glb', 'model GLB'], ['room_diorama.stl', 'diorama STL'], ['room_diorama_h2c.3mf', 'diorama H2C 3MF']]
      .filter(([f]) => had[f]).map(([f, t]) => `<a class="btn" href="${base}${f}" download="${meta.name}_${f}">${t}</a>`).join('');
  plate.scale.set(size * 0.75, 1, size * 0.75);
  say('loading the splat');
  try {
    object = new SplatMesh({ url: base + F.splat + stamp });
    (viewMode ? stand : turn).add(object);
    await object.initialized;
    state.splats = object.splats ? object.splats.getNumSplats() : (object.packedSplats ? object.packedSplats.numSplats : 0);
  } catch (e) { state.error = 'splat: ' + e; say('the splat did not load: ' + e); }
  if (F.solid) {
    new GLTFLoader().load(base + F.solid + stamp, (g) => {
      solid = g.scene;
      solid.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ color: 0xc9d2dc, roughness: 0.75, metalness: 0.0, vertexColors: false }); o.geometry.computeVertexNormals(); } });
      turn.add(solid); state.solid = true; apply();
    }, undefined, (e) => { state.solidError = String(e); });
  }
  state.ready = !state.error;
  if (state.ready) say(`${state.splats.toLocaleString()} Gaussians · ` + (viewMode ? 'drag to look round' : 'drag to turn, wheel to zoom'));
}

// view mode: the surface model of the surroundings (room.glb), looked at from outside like a doll's house, in place
// of standing inside the splat
let model = null, modelOn = false, seatCam = null;
const roof = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6);
function showModel(on) {
  modelOn = on;
  document.getElementById('bModel').classList.toggle('on', on);
  const openAbove = (meta.room && meta.room.open_above_m) || 2.3;
  roof.constant = renderer.xr.isPresenting ? (on ? 0.95 + openAbove / 12 : 1e6) : openAbove;
  if (on && !model) {
    say('loading the model');
    new GLTFLoader().load(base + F.model + stamp, (g) => {
      model = g.scene;
      // the ceiling and whatever is above head height are left off, so one looks into the room from above
      renderer.localClippingEnabled = true;
      model.traverse(o => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, clippingPlanes: [roof] }); });
      stand.add(model); state.model = true; showModel(modelOn);
    }, undefined, (e) => { state.modelError = String(e); say('the model did not load'); });
  }
  if (model) model.visible = on;
  if (object) object.visible = !on || !model;
  if (renderer.xr.isPresenting) {
    // in the headset: the model on a table in front of you at 1:12, or the place itself round you
    if (on && model) { stand.scale.setScalar(1 / 12); stand.position.set(0, 0.95, -0.6); }
    else { stand.scale.setScalar(1); stand.position.set(0, 0, 0); }
    return;
  }
  const s = (meta.room && meta.room.size_m) || [4, 2.5, 4];
  if (on) {
    if (!seatCam) seatCam = { p: camera.position.clone(), t: controls.target.clone(), min: controls.minDistance, max: controls.maxDistance, rs: controls.rotateSpeed };
    const R = Math.hypot(s[0], s[2]) / 2;
    controls.minDistance = 0.5; controls.maxDistance = 6 * R; controls.rotateSpeed = 1;
    controls.target.set(0, s[1] * 0.35, 0);
    // the model's sideways origin is the spot the pictures were taken from, not the room's middle: aim at where the mesh is
    if (model) { const b = new THREE.Box3().setFromObject(model); b.getCenter(controls.target); controls.target.y = b.min.y + (b.max.y - b.min.y) * 0.35; }
    camera.position.copy(controls.target).add(new THREE.Vector3(R * 1.25, R * 1.5, R * 1.25));
    say('the 3-D model · drag to turn, wheel to zoom');
  } else if (seatCam) {
    camera.position.copy(seatCam.p); controls.target.copy(seatCam.t);
    controls.minDistance = seatCam.min; controls.maxDistance = seatCam.max; controls.rotateSpeed = seatCam.rs; seatCam = null;
    say(`${state.splats.toLocaleString()} Gaussians · drag to look round`);
  }
  controls.update();
}

function apply() {
  if (viewMode) { plate.visible = false; return; }
  const both = show.splat && show.solid && !!solid && !show.room;         // side by side: splat left, solid right
  if (object) { object.visible = show.splat; object.position.x = both ? -size * 0.6 : 0; }
  if (solid) { solid.visible = show.solid; solid.position.x = both ? size * 0.6 : 0; }
  plate.scale.set(size * (both ? 1.35 : 0.75), 1, size * 0.75);
  if (!renderer.xr.isPresenting) {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, (both ? 3.4 : 2.5) * size);
  }
  if (show.room && !room && F.scene) {
    room = new SplatMesh({ url: base + F.scene + stamp }); stand.add(room);
  }
  if (room) room.visible = show.room;
  plate.visible = !show.room;
  for (const [id, k] of [['bSplat', 'splat'], ['bSolid', 'solid'], ['bRoom', 'room'], ['bTurn', 'turn']]) document.getElementById(id).classList.toggle('on', show[k]);
}
for (const [id, k] of [['bSplat', 'splat'], ['bSolid', 'solid'], ['bRoom', 'room'], ['bTurn', 'turn']])
  document.getElementById(id).onclick = () => { show[k] = !show[k]; if (k === 'room' && show.room) { show.turn = false; turn.rotation.y = 0; } apply(); };
if (q.has('solid')) show.solid = true;
if (q.has('nosplat')) show.splat = false;
if (q.has('room')) { show.room = true; show.turn = false; }
if (!F.scene) document.getElementById('bRoom').style.display = 'none';
if (!F.solid) document.getElementById('bSolid').style.display = 'none';
if (viewMode) for (const id of ['bSplat', 'bSolid', 'bRoom', 'bTurn']) document.getElementById(id).style.display = 'none';

const controls = new OrbitControls(camera, renderer.domElement);
if (viewMode) {
  // stand where the pictures were taken and look the way they looked: the camera swings on a short arm round a
  // point just in front of it, which reads as turning the head
  const a = q.has('yaw') ? parseFloat(q.get('yaw')) : meta.look_yaw_rad, p = meta.look_pitch_rad || 0, h = meta.eye_height_m || 1.3;
  const fwd = new THREE.Vector3(Math.sin(a) * Math.cos(p), Math.sin(p), -Math.cos(a) * Math.cos(p));
  camera.fov = 70; camera.updateProjectionMatrix();
  camera.position.set(0, h, 0);
  controls.target.copy(camera.position).addScaledVector(fwd, 0.2);
  controls.minDistance = 0.05; controls.maxDistance = 0.8; controls.rotateSpeed = -0.35;
} else {
  // on the laptop: look at the object from a little above
  controls.target.set(0, size * 0.35, 0);
  camera.position.set(size * 1.5, size * 1.0, size * 1.7);
}
controls.enableDamping = true; controls.update();
apply();
if (viewMode && F.model) {
  const b = document.getElementById('bModel');
  b.style.display = '';
  b.onclick = () => showModel(!modelOn);
  if (q.has('model')) showModel(true);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// in the headset: the object at real size on a stand a metre in front of where you were looking when you entered
let scale = 1, lastToggle = 0;
// A browser offers AR and VR only to a page at a secure address. Where this one is not, and the scan says where a
// secure copy of the site is, the corner points there in place of a button that could do nothing.
if (!navigator.xr && meta && meta.secure_copy && !isSecureContext) {
  document.getElementById('xr').innerHTML = `<span class="ask">In a headset: AR and VR need a secure address. <a href="${esc(meta.secure_copy)}view.html?scan=${esc(scan)}">Open this scan on the site's secure copy</a>.</span>`;
  state.secureCopy = true;
}
const sparkXr = !navigator.xr ? null : new SparkXr({
  renderer, mode: viewMode ? 'vrar' : 'arvr', referenceSpaceType: 'local-floor', elementId: undefined, element: undefined, button: true, enableHands: false,
  onEnterXr: () => {
    state.xr = true;
    renderer.setClearColor(0x000000, 0);
    document.getElementById('panel').style.display = 'none';
    scale = 1; stand.scale.setScalar(1);
    if (viewMode) {
      // the place itself, at its own size, round you: the spot the pictures were taken from under your feet, the
      // middle of what was looked at straight ahead
      stand.position.set(0, 0, 0); stand.rotation.set(0, meta.look_yaw_rad || 0, 0);
    } else stand.position.set(0, 1.0, -0.8);
    plate.visible = false;
  },
  onExitXr: () => {
    state.xr = false;
    renderer.setClearColor(0x0d1014, 1);
    document.getElementById('panel').style.display = '';
    stand.position.set(0, 0, 0); stand.scale.setScalar(1); stand.rotation.set(0, 0, 0); apply();
  },
});
window.sparkXr = sparkXr;

function xrInput(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp) continue;
    const ax = gp.axes.length >= 4 ? [gp.axes[2], gp.axes[3]] : [gp.axes[0] || 0, gp.axes[1] || 0];
    if (viewMode) {                      // either stick, sideways: turn the place round you; trigger: the model on a table
      if (Math.abs(ax[0]) > 0.25) stand.rotation.y += ax[0] * 1.2 * dt;
      const pulled = gp.buttons[0] && gp.buttons[0].pressed;
      if (pulled && performance.now() - lastToggle > 600 && F.model) { lastToggle = performance.now(); showModel(!modelOn); }
      continue;
    }
    if (src.handedness === 'right') {
      if (Math.abs(ax[0]) > 0.25) turn.rotation.y -= ax[0] * 1.8 * dt;
      if (Math.abs(ax[1]) > 0.25) { scale = Math.min(6, Math.max(0.25, scale * (1 - ax[1] * 1.2 * dt))); stand.scale.setScalar(scale); }
    } else if (src.handedness === 'left') {
      if (Math.abs(ax[1]) > 0.25) stand.position.y = Math.min(2, Math.max(0.2, stand.position.y - ax[1] * 0.5 * dt));
      if (Math.abs(ax[0]) > 0.25) stand.position.x += ax[0] * 0.5 * dt;
    }
    const pressed = gp.buttons[0] && gp.buttons[0].pressed;
    if (pressed && performance.now() - lastToggle > 500) {
      lastToggle = performance.now();
      // splat -> solid -> both -> splat
      if (show.splat && !show.solid) { show.splat = false; show.solid = true; }
      else if (!show.splat && show.solid) { show.splat = true; show.solid = true; }
      else { show.splat = true; show.solid = false; }
      apply(); plate.visible = false;
    }
  }
}

let last = performance.now();
renderer.setAnimationLoop((time) => {
  const dt = Math.min(0.1, (time - last) / 1000); last = time;
  if (renderer.xr.isPresenting) xrInput(dt);
  else { if (show.turn && !viewMode) turn.rotation.y += dt * 0.5; controls.update(); }
  renderer.render(scene, camera);
  state.frames++;
});
</script>
</body>
</html>
